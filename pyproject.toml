[project]
name = "maintenance"
dynamic = [ "version" ]
authors = [
    { name = "Katulos", email = "123748719+Katulos@users.noreply.github.com" }
]
maintainers = [
    { name = "Katulos", email = "123748719+Katulos@users.noreply.github.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">= 3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncclick>=8.4.2.1",
    "cryptography>=50.0.2",
    "dishka>=1.10.1",
    "dynaconf>=3.3.5",
    "fastapi>=0.162.7",
    "orjson>=3.13.0",
    "python-jose>=3.5.0",
    "sqlalchemy[postgresql-asyncpg]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[project.scripts]
mcli = "app.cli.commands:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app= ['locales/*']

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
